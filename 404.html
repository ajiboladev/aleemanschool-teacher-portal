<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=no">
    <meta name="description" content="Page not found - Aleeman School Portal">
    <title>404 - Page Not Found | Aleeman Portal</title>
    
    <link rel="icon" href="../aleeman-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f7f4;  /* very light green tint */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .portal-error-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            padding: 3rem 2.5rem;
            text-align: center;
            border: 1px solid rgba(46,139,87,0.2);
        }
        
        .error-icon-circle {
            width: 88px;
            height: 88px;
            margin: 0 auto 1.5rem;
            background: #ecf9f2;  /* pale green */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #2e8b57;
        }
        
        .error-number {
            font-size: 5rem;
            font-weight: 800;
            color: #1a5c3e;
            line-height: 1;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }
        
        .divider-line {
            width: 70px;
            height: 4px;
            background: #2e8b57;
            margin: 1.2rem auto;
            border-radius: 4px;
        }
        
        .error-heading {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a3c2a;
            margin-bottom: 0.8rem;
        }
        
        .error-text {
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }
        
        .btn-back-to-portal {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: #2e8b57;
            color: white;
            padding: 0.85rem 2.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.25s;
            border: none;
        }
        
        .btn-back-to-portal:hover {
            background: #227a48;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(46,139,87,0.3);
        }
        
        .small-help {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        
        .small-help a {
            color: #2e8b57;
            text-decoration: none;
            font-weight: 600;
        }
        
        .small-help a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 500px) {
            .portal-error-container {
                padding: 2rem 1.5rem;
            }
            .error-number {
                font-size: 3.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="portal-error-container">
        <!-- Green shield/exclamation mark icon -->
        <div class="error-icon-circle">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        
        <div class="error-number">404</div>
        <div class="divider-line"></div>
        
        <h1 class="error-heading">Page not found</h1>
        <p class="error-text">
            The page you are looking for doesn’t exist or may have been moved. 
            Please use the button below to return to the portal.
        </p>
        
        <a href="/index.html" class="btn-back-to-portal">
            <i class="fas fa-arrow-left"></i> Back to Portal
        </a>
        
        <p class="small-help">
            If the problem persists, contact <a href="#">Tech Support</a>
        </p>
    </div>
</body>
</html>
